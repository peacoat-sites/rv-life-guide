googleAnalytics = "G-1ED951ZQ52"
baseURL = "https://rv-life-guide.com/"
enableGitInfo = true
languageCode = "en-us"
title = "RV Life Guide"
[pagination]
  pagerSize = 12
enableRobotsTXT = true
enableEmoji = true

[params]
  description = "Your complete guide to full-time RV living — campgrounds, systems, budgeting, route planning, and making life on the road work long-term."
  niche = "RV Life & Van Living"
  adsense_id = "ca-pub-3466203197759215"
  adsense_slot_header = "auto"
  adsense_slot_incontent = "auto"
  adsense_slot_sidebar = "auto"
  image_query = "rv camper van life road trip camping"
  author = "RV Life Guide Editorial Team"
  logo_text = "RV Life Guide"
  tagline = "Hit the Road Full-Time"
  primary_color = "#1a1a2e"
  cloudflare_analytics = ""

  # Authority theme
  hero_color_1 = "#0d0d1a"
  hero_color_2 = "#1a1a2e"
  hero_color_3 = "#c9a84c"
  hero_color_4 = "#a07c30"
  monthly_readers = 82000
  research_hours  = 610
  satisfaction    = 95
  trust_extra     = "Full-time RVers & certified camping advisors"
  impact_verification = ""
  impact_tracking_id  = "" 

[taxonomies]
  category = "categories"
  tag = "tags"

[outputs]
  home = ["HTML", "RSS", "JSON"]
  section = ["HTML", "RSS"]

[sitemap]
  changefreq = "daily"
  priority = 0.5
  filename = "sitemap.xml"

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
  [markup.tableOfContents]
    startLevel = 2
    endLevel   = 3
    ordered    = false

[permalinks]
  posts = "/:slug/"

[related]
  includeNewer = true
  threshold    = 80
  toLower      = false
  [[related.indices]]
    name   = "keywords"
    weight = 100
  [[related.indices]]
    name   = "tags"
    weight = 80
  [[related.indices]]
    name   = "categories"
    weight = 50
